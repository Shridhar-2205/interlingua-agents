[project]
name = "files123"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk==1.1.2",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "typing_extensions>=4.12.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
markers = ["integration: requires running Alice and Bob servers"]
asyncio_mode = "auto"
